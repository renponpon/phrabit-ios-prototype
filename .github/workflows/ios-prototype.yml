name: iOS prototype - unsigned build only

on:
  workflow_dispatch:
    inputs:
      confirm_usage:
        description: 利用枠と料金を確認済み（署名・配布・API呼び出しはしません）
        type: boolean
        required: true
        default: false
      compile_audio_pilot:
        description: 本人用の音声パイロット分岐も未署名でコンパイル（接続設定・鍵・配布なし）
        type: boolean
        required: false
        default: false
      compile_startup_timing:
        description: 送信なしの録音開始計測版を未署名でビルド（接続設定・鍵・配布なし）
        type: boolean
        required: false
        default: false
      compile_translation_home:
        description: 送信なしの翻訳ホームを未署名でビルド（接続設定・鍵・配布なし）
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ios-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ inputs.confirm_usage }}
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify distribution-compatible toolchain
        run: |
          xcodeVersion="$(xcodebuild -version | head -n 1)"
          iosSdkVersion="$(xcrun --sdk iphoneos --show-sdk-version)"
          printf '%s\niOS SDK %s\n' "$xcodeVersion" "$iosSdkVersion"
          node -e 'const [xcode, sdk] = process.argv.slice(1); if (Number(xcode.replace("Xcode ", "").split(".")[0]) < 26 || Number(sdk.split(".")[0]) < 26) throw new Error("Xcode 26+ and iOS SDK 26+ are required for distribution preparation");' "$xcodeVersion" "$iosSdkVersion"
      - name: Validate prototype safety boundaries
        run: node scripts/check-ios-prototype.mjs
      - name: Test public export policy
        run: node --test scripts/ios-public-export-policy.test.mjs
      - name: Test native core
        run: |
          swift package --package-path native/ios/PhrabitCapture/Core resolve
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const lock = JSON.parse(fs.readFileSync('native/ios/PhrabitCapture/Core/Package.resolved', 'utf8'));
          const checkedIn = JSON.parse(execFileSync('git', ['show', 'HEAD:native/ios/PhrabitCapture/Core/Package.resolved'], { encoding: 'utf8' }));
          const revisions = value => value.pins.map(pin => [pin.identity, pin.state.revision, pin.state.version]).sort((left, right) => left[0].localeCompare(right[0]));
          assert.deepEqual(revisions(lock), revisions(checkedIn));
          const sdk = lock.pins.find(pin => pin.identity === 'supabase-swift');
          assert.equal(sdk?.state.version, '2.55.7');
          assert.equal(sdk?.state.revision, 'ed28cff9d3d246f54ebe75e52a7334e0a2f366de');
          process.stdout.write(`PHRABIT_CORE_LOCK=${JSON.stringify(lock)}\n`);
          NODE
          swift test --package-path native/ios/PhrabitCapture/Core
      - name: Install project generator
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
          xcodebuild -version
      - name: Generate Xcode project
        working-directory: native/ios/PhrabitCapture
        run: |
          xcodegen generate
          mkdir -p PhrabitCapture.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Core/Package.resolved PhrabitCapture.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Build simulator application and control without signing
        working-directory: native/ios/PhrabitCapture
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project PhrabitCapture.xcodeproj \
            -scheme PhrabitCapture \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/simulator-build.log
      - name: Verify bundled privacy manifests
        working-directory: native/ios/PhrabitCapture
        run: |
          appPath=build/DerivedData/Build/Products/Debug-iphonesimulator/PhrabitCapture.app
          controlPath="$appPath/PlugIns/PhrabitCaptureControl.appex"
          test -f "$appPath/PrivacyInfo.xcprivacy"
          test -f "$controlPath/PrivacyInfo.xcprivacy"
          plutil -lint "$appPath/PrivacyInfo.xcprivacy" "$controlPath/PrivacyInfo.xcprivacy"
          plutil -extract DTSDKName raw -o - "$appPath/Info.plist"
          plutil -extract UISupportedInterfaceOrientations json -o build/iphone-orientations.json "$appPath/Info.plist"
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const orientations = JSON.parse(fs.readFileSync('build/iphone-orientations.json', 'utf8'));
          assert.deepEqual([...orientations].sort(), [
            'UIInterfaceOrientationLandscapeLeft',
            'UIInterfaceOrientationLandscapeRight',
            'UIInterfaceOrientationPortrait',
            'UIInterfaceOrientationPortraitUpsideDown'
          ]);
          process.stdout.write('All four interface orientations are declared.\n');
          NODE
      - name: Build unsigned iPhone archive
        working-directory: native/ios/PhrabitCapture
        run: |
          set -o pipefail
          xcodebuild \
            -project PhrabitCapture.xcodeproj \
            -scheme PhrabitCapture \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PhrabitCapture.xcarchive \
            -derivedDataPath build/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive 2>&1 | tee build/device-archive.log
      - name: Verify unsigned iPhone archive identifiers and privacy
        working-directory: native/ios/PhrabitCapture
        run: |
          appPath=build/PhrabitCapture.xcarchive/Products/Applications/PhrabitCapture.app
          controlPath="$appPath/PlugIns/PhrabitCaptureControl.appex"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$appPath/Info.plist")" = com.phrabit.app
          test "$(plutil -extract CFBundleIdentifier raw -o - "$controlPath/Info.plist")" = com.phrabit.app.control
          test -f "$appPath/PrivacyInfo.xcprivacy"
          test -f "$controlPath/PrivacyInfo.xcprivacy"
          plutil -lint "$appPath/PrivacyInfo.xcprivacy" "$controlPath/PrivacyInfo.xcprivacy"
          plutil -extract DTSDKName raw -o - "$appPath/Info.plist"
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const archiveLog = fs.readFileSync('build/device-archive.log', 'utf8');
          assert.ok(!archiveLog.includes('All interface orientations must be supported'), 'Resolve the orientation warning before distribution');
          process.stdout.write('No interface-orientation warning in the iPhone archive build.\n');
          NODE
      - name: Verify Xcode uses the tested dependency revisions
        working-directory: native/ios/PhrabitCapture
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const core = JSON.parse(fs.readFileSync('Core/Package.resolved', 'utf8'));
          const xcode = JSON.parse(fs.readFileSync('PhrabitCapture.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'utf8'));
          const revisions = lock => lock.pins.map(pin => [pin.identity, pin.state.revision, pin.state.version]).sort((left, right) => left[0].localeCompare(right[0]));
          assert.deepEqual(revisions(xcode), revisions(core));
          process.stdout.write('Xcode and tested Core dependency revisions match.\n');
          NODE
      - name: Compile the audio pilot branch without connecting or signing
        if: ${{ inputs.compile_audio_pilot }}
        working-directory: native/ios/PhrabitCapture
        run: |
          cat > pilot-build.yml <<'YAML'
          include: [project.yml]
          targets:
            PhrabitCapture:
              settings:
                configs:
                  Debug:
                    SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) PHRABIT_LOCAL_LIVE_AUDIO'
          YAML
          xcodegen generate --spec pilot-build.yml
          mkdir -p PhrabitCapture.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Core/Package.resolved PhrabitCapture.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild \
            -project PhrabitCapture.xcodeproj \
            -scheme PhrabitCapture \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            -onlyUsePackageVersionsFromResolvedFile \
            build
          info=build/DerivedData/Build/Products/Debug-iphonesimulator/PhrabitCapture.app/Info.plist
          test -f "$info"
          plutil -lint "$info"
          if plutil -extract PhrabitPreviewAuthOnly json -o /dev/null "$info" 2>/dev/null; then
            echo 'The unsigned pilot compile must not contain connection settings.'
            exit 1
          fi
      - name: Build offline startup timing app and control without signing
        if: ${{ inputs.compile_startup_timing }}
        working-directory: native/ios/PhrabitCapture
        run: |
          cat > startup-timing-build.yml <<'YAML'
          include: [project.yml]
          settings:
            configs:
              Debug:
                SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) PHRABIT_OFFLINE_STARTUP_TIMING'
          YAML
          xcodegen generate --spec startup-timing-build.yml
          mkdir -p PhrabitCapture.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Core/Package.resolved PhrabitCapture.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild \
            -project PhrabitCapture.xcodeproj \
            -scheme PhrabitCapture \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/TimingDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -onlyUsePackageVersionsFromResolvedFile \
            build
          app=build/TimingDerivedData/Build/Products/Debug-iphoneos/PhrabitCapture.app
          control="$app/PlugIns/PhrabitCaptureControl.appex"
          for bundle in "$app" "$control"; do
            test -f "$bundle/Info.plist"
            test ! -e "$bundle/embedded.mobileprovision"
            test ! -d "$bundle/_CodeSignature"
            if plutil -extract PhrabitPreviewAuthOnly json -o /dev/null "$bundle/Info.plist" 2>/dev/null; then
              echo 'The timing build must not contain connection settings.'
              exit 1
            fi
          done
      - name: Build the offline translation home and control without signing
        if: ${{ inputs.compile_translation_home }}
        working-directory: native/ios/PhrabitCapture
        run: |
          cat > translation-home-build.yml <<'YAML'
          include: [project.yml]
          settings:
            configs:
              Debug:
                SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) PHRABIT_OFFLINE_TRANSLATION_HOME'
          YAML
          xcodegen generate --spec translation-home-build.yml
          mkdir -p PhrabitCapture.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Core/Package.resolved PhrabitCapture.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild \
            -project PhrabitCapture.xcodeproj \
            -scheme PhrabitCapture \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/TranslationHomeDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -onlyUsePackageVersionsFromResolvedFile \
            build
          app=build/TranslationHomeDerivedData/Build/Products/Debug-iphoneos/PhrabitCapture.app
          control="$app/PlugIns/PhrabitCaptureControl.appex"
          for bundle in "$app" "$control"; do
            test -f "$bundle/Info.plist"
            test ! -e "$bundle/embedded.mobileprovision"
            test ! -d "$bundle/_CodeSignature"
            if plutil -extract PhrabitPreviewAuthOnly json -o /dev/null "$bundle/Info.plist" 2>/dev/null; then
              echo 'The offline translation home must not contain connection settings.'
              exit 1
            fi
          done

