name: iOS prototype - unsigned build only

on:
  workflow_dispatch:
    inputs:
      confirm_usage:
        description: 利用枠と料金を確認済み（署名・配布・API呼び出しはしません）
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ios-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ inputs.confirm_usage }}
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate prototype safety boundaries
        run: node scripts/check-ios-prototype.mjs
      - name: Test native core
        run: swift test --package-path native/ios/PhrabitCapture/Core
      - name: Install project generator
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
          xcodebuild -version
      - name: Generate Xcode project
        working-directory: native/ios/PhrabitCapture
        run: xcodegen generate
      - name: Build simulator application and control without signing
        working-directory: native/ios/PhrabitCapture
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project PhrabitCapture.xcodeproj \
            -scheme PhrabitCapture \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/simulator-build.log

