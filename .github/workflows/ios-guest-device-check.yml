name: iOS guest device check - unsigned

on:
  workflow_dispatch:
    inputs:
      confirm_unsigned:
        description: 端末確認のコンパイル・模擬テストのみ（署名・配布なし）
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  verify:
    if: ${{ inputs.confirm_unsigned && github.repository == 'renponpon/phrabit-ios-prototype' && github.ref == 'refs/heads/main' }}
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    defaults:
      run:
        shell: bash
        working-directory: native/ios/PhrabitCapture/GuestAttest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check isolation from shipped targets
        working-directory: .
        run: node scripts/check-ios-prototype.mjs
      - name: Test the device flow with simulated keys and transport
        run: swift test --scratch-path "$RUNNER_TEMP/phrabit-guest-device-check-swift"
      - name: Compile the iPhone-only DeviceCheck and Keychain adapters
        run: |
          set -euo pipefail
          schemes="$(xcodebuild -list -json)"
          scheme="$(printf '%s' "$schemes" | node -e '
            const info = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            const values = info.workspace?.schemes ?? info.project?.schemes ?? [];
            const match = ["PhrabitGuestAttest", "PhrabitGuestAttest-Package"].find(name => values.includes(name));
            if (!match) process.exit(1);
            process.stdout.write(match);
          ')"
          xcodebuild -scheme "$scheme" -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/phrabit-guest-device-check-ios" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Compile and inspect the standalone probe without signing
        working-directory: native/ios/PhrabitCapture
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate --spec guest-device-probe.yml
          derived="$RUNNER_TEMP/phrabit-guest-device-probe-ios"
          xcodebuild -project PhrabitGuestDeviceProbe.xcodeproj -scheme PhrabitGuestDeviceProbe \
            -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          app="$derived/Build/Products/Release-iphoneos/PhrabitGuestDeviceProbe.app"
          info="$app/Info.plist"
          test -f "$info"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$info")" = com.phrabit.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.devicecheck.appattest-environment' Generated/GuestDeviceProbe.entitlements)" = production
          test ! -d "$app/PlugIns"
          test ! -d "$app/_CodeSignature"
          test ! -e "$app/embedded.mobileprovision"
          for key in NSMicrophoneUsageDescription NSCameraUsageDescription UIBackgroundModes NSAppTransportSecurity; do
            if plutil -extract "$key" json -o /dev/null "$info" 2>/dev/null; then
              echo "Unexpected Info.plist key: $key"
              exit 1
            fi
          done
      - name: Test the in-app confirmation request without a network
        working-directory: .
        run: node --test scripts/ios-guest-device-in-app.test.mjs
      - name: Build and inspect the in-app confirmation candidate without signing
        working-directory: native/ios/PhrabitCapture
        run: |
          set -euo pipefail
          xcodegen generate --spec guest-device-in-app.yml
          derived="$RUNNER_TEMP/phrabit-guest-device-in-app-ios"
          xcodebuild -project PhrabitGuestDeviceInApp.xcodeproj -scheme PhrabitGuestDeviceInApp \
            -configuration Debug -destination 'generic/platform=iOS' -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          app="$derived/Build/Products/Debug-iphoneos/PhrabitGuestDeviceInApp.app"
          info="$app/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$info")" = com.phrabit.app.guestdeviceinapp
          test ! -d "$app/PlugIns"
          test ! -d "$app/_CodeSignature"
          test ! -e "$app/embedded.mobileprovision"
          for key in NSMicrophoneUsageDescription NSCameraUsageDescription UIBackgroundModes NSAppTransportSecurity CFBundleURLTypes; do
            if plutil -extract "$key" json -o /dev/null "$info" 2>/dev/null; then exit 1; fi
          done
      - name: Validate the device confirmation Release overlay without signing
        working-directory: native/ios/PhrabitCapture
        run: |
          set -euo pipefail
          node --input-type=module -e 'import { guestDeviceInAppUnsignedReleaseSpec } from "../../../scripts/ios-testflight.mjs"; process.stdout.write(JSON.stringify(guestDeviceInAppUnsignedReleaseSpec()))' > guest-device-in-app-release-check.json
          xcodegen generate --spec guest-device-in-app-release-check.json
          derived="$RUNNER_TEMP/phrabit-guest-device-in-app-release"
          xcodebuild -project PhrabitGuestDeviceInApp.xcodeproj -scheme PhrabitGuestDeviceInApp \
            -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          app="$derived/Build/Products/Release-iphoneos/PhrabitGuestDeviceInApp.app"
          info="$app/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$info")" = com.phrabit.app
          test "$(plutil -extract PhrabitGuestDeviceInAppProofOnly raw -o - "$info")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.devicecheck.appattest-environment' Generated/GuestDeviceInApp.entitlements)" = production
          test -f "$app/Assets.car"
          test ! -d "$app/PlugIns"
          test ! -d "$app/_CodeSignature"
          test ! -e "$app/embedded.mobileprovision"
          for key in NSMicrophoneUsageDescription NSCameraUsageDescription UIBackgroundModes NSAppTransportSecurity CFBundleURLTypes ITSAppUsesNonExemptEncryption ITSEncryptionExportComplianceCode; do
            if plutil -extract "$key" json -o /dev/null "$info" 2>/dev/null; then exit 1; fi
          done
          node --input-type=module -e 'import assert from "node:assert/strict"; import { readFileSync } from "node:fs"; assert.ok(readFileSync(process.argv[1]).includes("requestMediaCapturePermissionForOrigin:initiatedByFrame:type:decisionHandler:"));' "$app/PhrabitGuestDeviceInApp"
