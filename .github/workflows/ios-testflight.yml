name: iOS prototype - internal TestFlight

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: 検証・承認したmainの40桁コミットSHA
        type: string
        required: true
      confirm_internal_only:
        description: 本人限定の署名検証または内部配布を承認済み（一般公開・AI接続なし）
        type: boolean
        required: true
        default: false
      preview_auth_only:
        description: 検証用Googleログインと接続確認（録音は別オプション）
        type: boolean
        required: true
        default: false
      preview_capture_check:
        description: Preview接続確認専用APIを使う（preview_auth_only必須）
        type: boolean
        required: true
        default: false
      preview_mock_recording:
        description: 端末内だけで録音し固定訳文を表示（両方のPreview設定必須）
        type: boolean
        required: true
        default: false
      preview_audio_access_only:
        description: 新経路の接続確認だけ（preview_auth_only必須、旧接続確認・録音はOFF）
        type: boolean
        required: true
        default: false
      preview_audio_pilot_archive_only:
        description: 音声候補の署名と書き出しだけ（preview_auth_only必須、Appleアップロードなし）
        type: boolean
        required: false
        default: false
      preview_audio_pilot_upload_internal:
        description: 本人用の実音声版をAppleに提出（別承認・内部限定、配布追加なし）
        type: boolean
        required: false
        default: false
      confirm_audio_pilot_no_auto_distribution:
        description: 本人用実音声の提出前に、内部グループの自動配布なしを確認済み
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ios-internal-testflight
  cancel-in-progress: false

jobs:
  distribute:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_internal_only }}
    runs-on: macos-26-intel
    timeout-minutes: 20
    environment: ios-testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - name: Check approved commit before checkout
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate offline prototype and distribution guards
        run: |
          node scripts/check-ios-prototype.mjs
          node --test scripts/ios-public-export-policy.test.mjs scripts/ios-testflight.test.mjs
          swift test --package-path native/ios/PhrabitCapture/Core
      - name: Install project generator
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Import approved signing material
        env:
          IOS_PREVIEW_AUTH_ONLY: ${{ inputs.preview_auth_only }}
          IOS_PREVIEW_CAPTURE_CHECK: ${{ inputs.preview_capture_check }}
          IOS_PREVIEW_MOCK_RECORDING: ${{ inputs.preview_mock_recording }}
          IOS_PREVIEW_AUDIO_ACCESS_ONLY: ${{ inputs.preview_audio_access_only }}
          IOS_PREVIEW_AUDIO_PILOT_ARCHIVE_ONLY: ${{ inputs.preview_audio_pilot_archive_only }}
          IOS_PREVIEW_AUDIO_PILOT_UPLOAD_INTERNAL: ${{ inputs.preview_audio_pilot_upload_internal }}
          IOS_AUDIO_PILOT_NO_AUTO_DISTRIBUTION: ${{ inputs.confirm_audio_pilot_no_auto_distribution }}
          IOS_PREVIEW_PROJECT_REF: ${{ secrets.IOS_PREVIEW_PROJECT_REF }}
          IOS_PREVIEW_PUBLISHABLE_KEY: ${{ secrets.IOS_PREVIEW_PUBLISHABLE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.IOS_SIGNING_CERTIFICATE_BASE64 }}
          IOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_CONTROL_PROFILE_BASE64: ${{ secrets.IOS_CONTROL_PROFILE_BASE64 }}
        run: node scripts/ios-testflight.mjs prepare
      - name: Build and verify signed iPhone archive
        run: node scripts/ios-testflight.mjs build
      - name: Upload to App Store Connect for internal testing
        if: ${{ !inputs.preview_audio_pilot_archive_only && !inputs.preview_audio_pilot_upload_internal }}
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node scripts/ios-testflight.mjs upload
      - name: Submit audio pilot build to Apple for internal testing only
        if: ${{ inputs.preview_audio_pilot_upload_internal && !inputs.preview_audio_pilot_archive_only && inputs.confirm_audio_pilot_no_auto_distribution }}
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node scripts/ios-testflight.mjs upload-audio-pilot
      - name: Remove temporary signing and upload material
        if: ${{ always() }}
        run: node scripts/ios-testflight.mjs cleanup
